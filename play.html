<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hộp quà gửi Lan Anh 🎁</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at 50% 20%, #ffe6f0, #ffc2d6 45%, #f79ab8);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  .stage { text-align: center; position: relative; z-index: 3; }

  .hint {
    color: #b03a63;
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 22px;
    animation: bounceHint 1.6s ease-in-out infinite;
    text-shadow: 0 2px 6px rgba(255,255,255,0.9);
  }
  @keyframes bounceHint {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  /* ===== HỘP QUÀ ===== */
  .gift {
    position: relative;
    width: 220px;
    height: 200px;
    margin: 0 auto 18px;
    cursor: pointer;
    transition: transform 0.25s;
    animation: giftFloat 2.6s ease-in-out infinite;
    z-index: 5;
  }
  .gift:hover { transform: scale(1.05); }

  @keyframes giftFloat {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-10px) rotate(1deg); }
  }

  .box {
    position: absolute;
    bottom: 0;
    width: 220px;
    height: 145px;
    background: linear-gradient(135deg, #ff5c8a, #e0356b);
    border-radius: 10px;
    box-shadow: 0 18px 35px rgba(180, 40, 90, 0.4);
    overflow: hidden;
  }
  .box::before {
    content: '';
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 34px;
    height: 100%;
    background: linear-gradient(#ffd76b, #f7b733);
  }

  .lid {
    position: absolute;
    top: 0;
    left: -10px;
    width: 240px;
    height: 58px;
    background: linear-gradient(135deg, #ff7aa2, #ff4d80);
    border-radius: 10px;
    box-shadow: 0 8px 18px rgba(180, 40, 90, 0.35);
    z-index: 4;
    transform-origin: left bottom;
    transition: transform 0.9s cubic-bezier(0.25, 1, 0.4, 1.2);
    overflow: hidden;
  }
  .lid::before {
    content: '';
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 34px;
    height: 100%;
    background: linear-gradient(#ffe38a, #f7b733);
  }

  .bow {
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 44px;
    z-index: 5;
  }
  .bow span {
    position: absolute;
    top: 0;
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, #ffd76b, #f7b733);
    border-radius: 50% 50% 50% 0;
    box-shadow: 0 4px 10px rgba(200, 140, 20, 0.4);
  }
  .bow span:first-child { left: 0; transform: rotate(-45deg); }
  .bow span:last-child { right: 0; transform: rotate(45deg) scaleX(-1); }

  .gift.open .lid { transform: rotate(-28deg) translate(-16px, -24px); }
  .gift.open { animation: none; transform: scale(1.02); }

  .glow {
    position: absolute;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    width: 180px;
    height: 180px;
    background: radial-gradient(circle, rgba(255,255,200,0.95), rgba(255,220,120,0) 70%);
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.6s, transform 0.6s;
    z-index: 2;
    pointer-events: none;
  }
  .gift.open .glow { opacity: 1; transform: translateX(-50%) scale(1.15); }

  .open-btn {
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, #ff6b9d, #ff8fab);
    color: white;
    font-size: 16px;
    font-weight: 700;
    padding: 12px 30px;
    border-radius: 50px;
    box-shadow: 0 8px 18px rgba(255, 107, 157, 0.45);
    transition: transform 0.2s;
    position: relative;
    z-index: 6;
  }
  .open-btn:hover { transform: translateY(-3px) scale(1.05); }
  .open-btn:active { transform: scale(0.97); }

  /* ===== THIỆP CHÚC ===== */
  .card {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.4);
    width: min(90vw, 430px);
    background: rgba(255, 255, 255, 0.98);
    border-radius: 22px;
    padding: 30px 24px;
    box-shadow: 0 25px 60px rgba(160, 30, 80, 0.4);
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s 0.35s, transform 0.6s 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.4);
    z-index: 100;
    border: 2px solid #ffd0e0;
  }
  .card.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    pointer-events: auto;
  }

  .card .icon { font-size: 46px; margin-bottom: 10px; animation: float 3s ease-in-out infinite; }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .card h1 { font-size: 24px; color: #d6336c; margin-bottom: 14px; }
  .card p { font-size: 16px; line-height: 1.75; color: #4a3b40; margin-bottom: 12px; }
  .card p strong { color: #d6336c; }
  .card .sign { margin-top: 16px; font-size: 14px; color: #b07a88; font-style: italic; }

  .close-btn {
    margin-top: 20px;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, #ff6b9d, #ff8fab);
    color: white;
    font-size: 15px;
    font-weight: 700;
    padding: 11px 26px;
    border-radius: 50px;
    box-shadow: 0 8px 18px rgba(255, 107, 157, 0.45);
  }
  .close-btn:hover { transform: translateY(-3px) scale(1.04); }

  .float-item {
    position: absolute;
    bottom: -40px;
    font-size: 22px;
    pointer-events: none;
    animation: rise linear infinite;
    opacity: 0.9;
    z-index: 1;
  }
  @keyframes rise {
    0% { transform: translateY(0) rotate(0deg); opacity: 0.9; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  .confetti {
    position: fixed;
    top: -20px;
    width: 9px;
    height: 9px;
    border-radius: 2px;
    pointer-events: none;
    animation: confettiFall linear forwards;
    z-index: 90;
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

  <div class="stage">
    <p class="hint" id="hint">🎁 Bấm vào hộp quà để mở nhé Lan Anh!</p>

    <div class="gift" id="gift">
      <div class="glow"></div>
      <div class="lid">
        <div class="bow"><span></span><span></span></div>
      </div>
      <div class="box"></div>
    </div>

    <button class="open-btn" id="openBtn">Mở quà 🎀</button>
  </div>

  <div class="card" id="card">
    <div class="icon">🎉</div>
    <h1>Gửi Lan Anh!</h1>
    <p>
      Món quà nhỏ này dành tặng <strong>Lê Thị Lan Anh</strong>.
      Chúc Lan Anh luôn vui vẻ, mạnh khỏe và gặp nhiều điều may mắn.
    </p>
    <p>
      Mong mỗi ngày của <strong>La</strong> đều có thật nhiều niềm vui,
      tiếng cười và những điều tốt đẹp nhất! 🌷
    </p>
    <p class="sign">— Người gửi ẩn danh —</p>

    <button class="close-btn" id="closeBtn">Đóng lại</button>
  </div>

  <script>
    const gift = document.getElementById('gift');
    const card = document.getElementById('card');
    const hint = document.getElementById('hint');
    const openBtn = document.getElementById('openBtn');
    const closeBtn = document.getElementById('closeBtn');

    let opened = false;

    function createFloatItem() {
      const item = document.createElement('div');
      item.classList.add('float-item');
      item.textContent = ['💖','✨','🌸','🎈','⭐','🌷'][Math.floor(Math.random()*6)];
      item.style.left = Math.random() * 100 + 'vw';
      item.style.fontSize = (16 + Math.random() * 18) + 'px';
      item.style.animationDuration = (7 + Math.random() * 6) + 's';
      item.style.animationDelay = Math.random() * 3 + 's';
      document.body.appendChild(item);
      setTimeout(() => item.remove(), 15000);
    }
    setInterval(createFloatItem, 500);

    function createConfetti() {
      const colors = ['#ff6b9d','#ffd166','#8ecae6','#ff8fab','#c77dff','#ffffff','#f7b733'];
      for (let i = 0; i < 70; i++) {
        const c = document.createElement('div');
        c.classList.add('confetti');
        c.style.left = Math.random() * 100 + 'vw';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
        c.style.animationDelay = Math.random() * 0.5 + 's';
        c.style.width = c.style.height = (6 + Math.random() * 8) + 'px';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 6000);
      }
    }

    function openGift() {
      if (opened) return;
      opened = true;

      gift.classList.add('open');
      hint.style.opacity = '0';

      createConfetti();
      setTimeout(createConfetti, 900);

      setTimeout(() => card.classList.add('show'), 300);
    }

    function closeGift() {
      card.classList.remove('show');
      gift.classList.remove('open');
      hint.style.opacity = '1';
      opened = false;
    }

    gift.addEventListener('click', openGift);
    gift.querySelectorAll('*').forEach(el => el.addEventListener('click', openGift));
    openBtn.addEventListener('click', openGift);
    closeBtn.addEventListener('click', closeGift);
  </script>

</body>
</html>
